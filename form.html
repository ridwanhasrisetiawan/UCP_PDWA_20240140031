<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Community</title>
    
   
</head>
<body>

    <h1>DATA MASYARAKAT</h1>
    <div class="container text-center">
    

    <form id="DATA MASYARAKAT">
        <label class="form-label">Nama</label>
        <input type="text" id="nama" class="form-control" required>

        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>

        <label class="form-label">Bidang Minat</label>
        <select id="minat" class="form-control">
            <option>Web Development</option>
            <option>Mobile Development</option>
            <option>UI/UX Design</option>
            <option>Cyber Security</option>
        </select>

        <button type="submit" class="btn btn-success mt-3">Submit</button>
    </form>

    <div id="hasil" class="mt-4"></div>

    <a href="index.html" class="btn btn-secondary mt-3">Kembali</a>
</div>

<script>
    let dataAnggota = JSON.parse(localStorage.getItem("anggota")) || [];

    document.getElementById("formAnggota").addEventListener("submit", function(e) {
        e.preventDefault();

        let nama = document.getElementById("nama").value;
        let email = document.getElementById("email").value;
        let minat = document.getElementById("minat").value;

        let data = { nama, email, minat };

        dataAnggota.push(data);

        // simpan ke localStorage
        localStorage.setItem("anggota", JSON.stringify(dataAnggota));

        alert("Data berhasil disimpan!");

        document.getElementById("formAnggota").reset();
    });
</script>

</body>
</html>
